[package]
name = "lockpad"
version = "1.9.0"
description = "LockPad - Notas rápidas com cofre criptografado"
authors = ["LockPad"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2.5"
walkdir = "2"
mime_guess = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
